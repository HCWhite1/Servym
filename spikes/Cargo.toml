# Essais de la phase 0 : hors de l'espace de travail principal, jamais construits par la CI.
[workspace]
resolver = "3"
members = ["scrypt-node", "tcp-table", "hidden-launch", "tauri-window"]

[workspace.package]
edition = "2024"
publish = false

# Même profil que l'espace de travail principal, pour mesurer la taille réelle.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "unwind"
