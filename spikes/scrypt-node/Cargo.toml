[package]
name = "scrypt-node"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
scrypt = { version = "0.11", default-features = false }
base64 = "0.22"
rand = "0.9"
subtle = "2"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
