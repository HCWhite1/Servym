[package]
name = "servynex-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "servynex"
path = "src/main.rs"

[dependencies]
servynex-core = { path = "../servynex-core" }
servynex-sys = { path = "../servynex-sys" }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
servynex-fixtures = { path = "../servynex-fixtures" }
regex = "1"
